plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fhmatchcentre'
version = '0.1.0'

android {
  namespace "expo.modules.fileshare"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // FileProvider: hands the file to the app the umpire picks.
  implementation "androidx.core:core:1.13.1"
}
