# Builds the phone and Wear OS apps on every push, with scripts/release-android.mjs.
#
# - Any branch (e.g. dev): the APKs, and the App Bundles for Google Play, are attached to the
#   workflow run as artifacts: Actions → the run → Artifacts.
# - main (a merged pull request arrives as a push to main): the same, plus a GitHub pre-release
#   with the files attached, tagged v<version>-<stage>.<build>, e.g. v0.3.0-alpha.42.
#
# Build numbers: each run uses its run number, so every new APK installs over the last one.
# The version name comes from version.json.
#
# Signing: with the repository secrets below, both apps are signed with the upload key, like a
# local `pnpm release:android`. Without them they're signed with the debug key: they install
# and sync with each other, but Google Play refuses them. See README.md, "Building in GitHub Actions".
#   FH_UPLOAD_KEYSTORE_BASE64   the .jks file, base64-encoded
#   FH_UPLOAD_STORE_PASSWORD, FH_UPLOAD_KEY_ALIAS, FH_UPLOAD_KEY_PASSWORD

name: Android apps

on:
  push:
    branches: ["**"]
    paths-ignore: ["landing/**", "web/**", "api/**", "deploy/**", "docs/**", "**/*.md", "inspiration-images/**"]
  workflow_dispatch:

# A newer push to the same branch replaces a build still running.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # The phone app's stage (see mobile/src/config.ts). Change to beta when the beta opens.
  STAGE: alpha
  FH_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [phone, watch]
    steps:
      - name: Free disk space
        # The phone's native build needs more room than the runner leaves free; these are tools it doesn't use.
        if: matrix.app == 'phone'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: pnpm/action-setup@v6
        if: matrix.app == 'phone'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ matrix.app == 'phone' && 'pnpm' || '' }}

      - name: Install packages
        if: matrix.app == 'phone'
        run: pnpm install --frozen-lockfile

      - name: Install CMake 3.31.6
        # The version the phone app's native build is set to (mobile/plugins/with-cmake-version.js).
        if: matrix.app == 'phone'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" > /dev/null

      - name: Set up the upload key
        env:
          KEYSTORE: ${{ secrets.FH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FH_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FH_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No upload key in the repository secrets: signing with the debug key (Google Play refuses these)."
            echo "SIGNING=--debug-key" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # Gradle reads ORG_GRADLE_PROJECT_* as project properties, the same ones as ~/.gradle/gradle.properties.
          {
            echo "ORG_GRADLE_PROJECT_FH_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "ORG_GRADLE_PROJECT_FH_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_FH_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_FH_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x watch-wear/gradlew
          node scripts/release-android.mjs ${{ matrix.app }} --apk $SIGNING ${{ env.STAGE == 'beta' && '--beta' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: fh-match-centre-${{ matrix.app }}-${{ env.STAGE }}-${{ github.run_number }}
          path: dist/play/*
          if-no-files-found: error

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  release:
    name: GitHub release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./version.json').version")
          tag="v$version-$STAGE.$FH_BUILD_NUMBER"
          prerelease=$([ "$STAGE" = "release" ] || echo "--prerelease")
          gh release create "$tag" files/* \
            --target "$GITHUB_SHA" \
            --title "$version-$STAGE (build $FH_BUILD_NUMBER)" \
            $prerelease \
            --notes "Built from $GITHUB_SHA.

          - **APKs** install directly: the phone one on the phone, the watch one with adb (see the landing page's install steps). Install both from the same release so they sync.
          - **.aab** files are for Google Play: the phone one to the phone track, the watch one to the Wear OS track.

          Version codes: phone $FH_BUILD_NUMBER, watch $((1000000 + FH_BUILD_NUMBER))."
