# TLS settings shared by the fhmatchcentre.com server blocks.
# Installed as /etc/nginx/snippets/fh-tls.conf by provision.sh.

ssl_certificate /etc/letsencrypt/live/fhmatchcentre.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/fhmatchcentre.com/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:FHSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# No OCSP stapling: Let's Encrypt certificates no longer carry an OCSP responder.
