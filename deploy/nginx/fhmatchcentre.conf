# FH Match Centre: /v1/* goes to the API, everything else to the website.
# Installed as /etc/nginx/sites-available/fhmatchcentre.conf by provision.sh.

upstream fh_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream fh_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP: certificate renewals, then everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name fhmatchcentre.com www.fhmatchcentre.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fhmatchcentre.com$request_uri;
    }
}

# www → apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fhmatchcentre.com;

    include /etc/nginx/snippets/fh-tls.conf;

    return 301 https://fhmatchcentre.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fhmatchcentre.com;

    include /etc/nginx/snippets/fh-tls.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Match documents are small; 2 MB leaves plenty of room.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css text/csv application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Appends the visitor's address; the API trusts only 127.0.0.1, so it reads the last entry.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/ {
        proxy_pass http://fh_api;
        # PDF reports can take a few seconds the first time.
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://fh_web;
    }
}
