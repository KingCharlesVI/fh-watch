# Used only until the first certificate exists: answers Let's Encrypt's challenge over HTTP.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name fhmatchcentre.com www.fhmatchcentre.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "FH Match Centre is being set up.\n";
    }
}
